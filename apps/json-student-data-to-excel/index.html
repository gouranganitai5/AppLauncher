<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JSON Student Data to Excel</title>
  
  <!-- SheetJS for Excel Download -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient animated background circles */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite alternate ease-in-out;
    }

    .shape-1 {
      width: 320px;
      height: 320px;
      background: rgba(99, 102, 241, 0.25);
      top: 10%;
      left: 15%;
    }

    .shape-2 {
      width: 380px;
      height: 380px;
      background: rgba(236, 72, 153, 0.2);
      bottom: 10%;
      right: 15%;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Drop Zone Styling */
    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.02);
      position: relative;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
      transform: translateY(-2px);
    }

    .drop-zone i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 16px;
      transition: transform 0.3s ease;
    }

    .drop-zone:hover i {
      transform: translateY(-5px);
    }

    .drop-zone p {
      margin-bottom: 8px;
      font-weight: 500;
    }

    .drop-zone span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    #fileInput {
      display: none;
    }

    /* Dynamic Output / Preview Section */
    .result-section {
      margin-top: 32px;
      display: none;
      animation: slideUp 0.5s ease-out forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .meta-info {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .preview-table-wrapper {
      max-height: 250px;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      margin-bottom: 24px;
    }

    .preview-table-wrapper::-webkit-scrollbar {
      width: 6px;
    }
    .preview-table-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 16px;
      font-size: 0.9rem;
    }

    th {
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
    }

    tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.4);
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .error-box {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--error);
      font-size: 0.9rem;
      display: none;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="container">
    <header>
      <h1>Student JSON to Excel Converter</h1>
      <p>Upload your JSON file to filter Roll No and Student Name into an Excel spreadsheet.</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <i class="fa-solid fa-file-code"></i>
      <p>Drag & drop your JSON file here</p>
      <span>or click to browse files</span>
      <input type="file" id="fileInput" accept=".json" />
    </div>

    <div class="error-box" id="errorBox">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="errorMessage">Invalid file structure.</span>
    </div>

    <div class="result-section" id="resultSection">
      <div id="metaInfoContainer" class="meta-info"></div>

      <div class="status-badge">
        <i class="fa-solid fa-circle-check"></i>
        <span id="recordCount">0 Records Processed</span>
      </div>

      <div class="preview-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Name</th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>

      <button class="btn" id="downloadBtn">
        <i class="fa-solid fa-file-excel"></i> Download Excel (.xlsx)
      </button>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultSection = document.getElementById('resultSection');
    const previewBody = document.getElementById('previewBody');
    const recordCount = document.getElementById('recordCount');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const metaInfoContainer = document.getElementById('metaInfoContainer');

    let processedData = [];

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) handleFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (file.type !== "application/json" && !file.name.endsWith('.json')) {
        showError("Please upload a valid JSON file (.json).");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const rawData = JSON.parse(event.target.result);
          parseStudentJson(rawData);
          hideError();
        } catch (err) {
          showError("Error parsing JSON: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function parseStudentJson(jsonObj) {
      let studentsList = [];
      let metadata = {};

      // Handle root array format or object format (e.g., class data with metadata)
      if (Array.isArray(jsonObj)) {
        studentsList = jsonObj;
      } else if (jsonObj.students && Array.isArray(jsonObj.students)) {
        studentsList = jsonObj.students;
        if (jsonObj.heading) {
          metadata = jsonObj.heading;
        }
      } else {
        throw new Error("Could not find a valid student list array inside the JSON file.");
      }

      // Display metadata if present (school name, class, section, etc.)
      if (metadata.schoolName || metadata.className) {
        metaInfoContainer.style.display = 'flex';
        metaInfoContainer.innerHTML = `
          <span><strong>School:</strong> ${escapeHtml(metadata.schoolName || 'N/A')}</span>
          <span><strong>Class:</strong> ${escapeHtml(metadata.className || 'N/A')}</span>
          <span><strong>Section:</strong> ${escapeHtml(metadata.section || 'N/A')}</span>
        `;
      } else {
        metaInfoContainer.style.display = 'none';
      }

      // Filter each student to extract Roll No & Name while ignoring other attributes
      processedData = studentsList.map(item => {
        const rollNoVal = item.rollNo ?? item.roll ?? item["Roll No"] ?? item["roll_no"] ?? "N/A";
        const nameVal = item.name ?? item.studentName ?? item["Name"] ?? item["Student Name"] ?? "N/A";

        return {
          "Roll No": String(rollNoVal),
          "Name": String(nameVal)
        };
      });

      renderPreview();
    }

    function renderPreview() {
      previewBody.innerHTML = '';
      
      processedData.forEach(student => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(student["Roll No"])}</td>
          <td>${escapeHtml(student["Name"])}</td>
        `;
        previewBody.appendChild(tr);
      });

      recordCount.textContent = `${processedData.length} Record${processedData.length === 1 ? '' : 's'} Ready`;
      resultSection.style.display = 'block';
    }

    downloadBtn.addEventListener('click', () => {
      if (!processedData.length) return;

      const worksheet = XLSX.utils.json_to_sheet(processedData);
      
      // Dynamic column width formatting
      worksheet['!cols'] = [
        { wch: 12 }, // Roll No width
        { wch: 32 }  // Name width
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Student List");

      XLSX.writeFile(workbook, "Student_Roll_List.xlsx");
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBox.style.display = 'flex';
      resultSection.style.display = 'none';
    }

    function hideError() {
      errorBox.style.display = 'none';
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
